name: Notchling
options:
  bundleIdPrefix: com.notchling
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_APP_SANDBOX: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_FILE: Notchling/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.notchling.app
    PRODUCT_NAME: Notchling
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_APPROACHABLE_CONCURRENCY: "NO"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    GCC_TREAT_WARNINGS_AS_ERRORS: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Notchling Contributors"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "NO"
    SDKROOT: macosx
    CLANG_ENABLE_OBJC_ARC: "YES"
    ENABLE_PREVIEWS: "NO"
    USER_HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/Notchling/Media"
      - "$(SRCROOT)/Notchling/HUD"
targets:
  Notchling:
    type: application
    platform: macOS
    sources:
      - path: Notchling
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Notchling/Support/Notchling-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        OTHER_LDFLAGS:
          - -framework
          - IOKit
          - -framework
          - CoreAudio
          - -framework
          - CoreGraphics
          - -framework
          - ApplicationServices
          - -framework
          - AVFoundation
          - -framework
          - EventKit
          - -framework
          - ServiceManagement
schemes:
  Notchling:
    build:
      targets:
        Notchling: all
    run:
      config: Debug
    archive:
      config: Release
